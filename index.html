<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnePort365 Operations Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="design/tokens.css" />
  <style>

/*
  OnePort365 operations dashboard.
  Colours, type, radius and shadows all come from design/tokens.css
  (see design/DESIGN_SYSTEM.md). Lime marks work in progress; red only
  for delayed / overdue; gold for waiting on someone.
*/

* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--op-cream);
  color: var(--op-silver-dark);
  font-family: var(--op-font-body);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--op-dark-green); outline-offset: 2px; }
.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  font-weight: 700; color: var(--op-dark-green); border-bottom: 1.5px solid var(--op-dark-green);
}

/* ---------- Shell ---------- */
.shell { display: flex; min-height: 100%; }
.rail {
  width: 72px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  background: var(--op-dark-green);
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0;
}
.rail-mark {
  width: 40px; height: 40px; border-radius: 12px; margin-bottom: 14px;
  background: var(--op-accent-lime); color: var(--op-dark-green);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--op-font-display); font-weight: 700; font-size: 14px;
}
.rail-btn {
  width: 44px; height: 44px; border-radius: var(--op-radius-md);
  display: flex; align-items: center; justify-content: center;
  color: var(--op-light-green);
}
.rail-btn svg { width: 22px; height: 22px; }
.rail-btn:hover { background: rgba(255,255,255,.1); color: var(--op-white); }
.rail-btn.active { background: var(--op-accent-lime); color: var(--op-dark-green); }
.rail-spacer { flex: 1; }

.main {
  flex: 1; min-width: 0;
  padding-block: 28px 40px;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-error { background: var(--op-error); }
.dot-warning { background: var(--op-gold); }

/* ---------- Tracker ---------- */
.tracker {
  background: var(--op-white); border: 1px solid var(--op-border-card); border-radius: var(--op-radius-xl);
  box-shadow: var(--op-elevation-1); padding: 20px 22px 16px;
}
.tracker-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.tracker-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tracker h2 { margin: 0; font-family: var(--op-font-display); font-weight: 600; font-size: 18px; color: var(--op-dark-green); }
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 12px;
  background: var(--op-accent-lime); color: var(--op-dark-green); border-radius: var(--op-radius-full);
  font-weight: 700; font-size: 12px;
}
.filter-chip button {
  width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(2,56,25,.12); color: var(--op-dark-green); display: flex; align-items: center; justify-content: center;
}
.filter-chip svg { width: 12px; height: 12px; }
.search {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; width: min(280px, 100%);
  background: var(--op-light-green); border-radius: var(--op-radius-md); color: var(--op-dark-green);
}
.search svg { width: 17px; height: 17px; flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--op-dark-green); }
.search input::placeholder { color: #4a5a3f; }
.search:focus-within { box-shadow: var(--op-focus-ring); }

.legend {
  list-style: none; margin: 14px 0 6px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px;
  font-size: 12px; color: var(--op-silver-light);
}
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 22px; height: 10px; border-radius: 3px; border: 1px solid var(--op-border-input); }
.sw-done { background: var(--op-dark-green); border-color: var(--op-dark-green); }
.sw-current { background: var(--hatch); border-color: var(--op-dark-green); }
.sw-todo { background: var(--op-white); }
.sw-lost { border-style: dashed; background: var(--op-chip-error-bg); border-color: var(--op-chip-error-text); }

.track-table { --hatch: repeating-linear-gradient(-45deg, rgba(2,56,25,.55) 0 1.5px, transparent 1.5px 7px), var(--op-accent-lime); }
.legend { --hatch: repeating-linear-gradient(-45deg, rgba(2,56,25,.55) 0 1.5px, transparent 1.5px 6px), var(--op-accent-lime); }
.table-wrap { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }
.track-table { min-width: 760px; }
.track-row {
  display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 16px;
  padding: 6px 0;
}
.track-header { padding: 10px 0 6px; border-bottom: 1px solid var(--op-border-divider); margin-bottom: 4px; }
.track-header > span { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--op-silver-light); }
.phases { display: grid; grid-template-columns: 16fr 23fr 23fr 38fr; }
.track-header .phases span { text-align: center; font-family: var(--op-font-display); font-weight: 600; font-size: 13px; color: var(--op-dark-green); }

.ship {
  width: 100%; display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 16px; cursor: pointer;
  background: none; border: 0; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);
  border-radius: var(--op-radius-md); text-align: left;
}
.ship:hover { background: var(--op-chip-neutral-bg); }
.ship-id { display: flex; flex-direction: column; min-width: 0; }
.ship-id b { display: inline-flex; align-items: center; gap: 8px; font-family: var(--op-font-display); font-weight: 600; font-size: 14px; color: var(--op-dark-green); }
.ship-id small { font-size: 12px; color: var(--op-silver-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bar {
  display: grid; grid-template-columns: 16fr 23fr 23fr 38fr; height: 32px;
  border: 1.5px solid var(--op-border-input); border-radius: var(--op-radius-md); overflow: hidden; background: var(--op-white);
}
.seg { position: relative; border-right: 1px solid var(--op-border-card); display: flex; align-items: center; justify-content: center; min-width: 0; }
.seg:last-child { border-right: 0; }
.seg-done { background: var(--op-dark-green); border-right-color: rgba(253,251,241,.25); }
.seg-current { background: var(--hatch); }
.seg-label {
  max-width: calc(100% - 10px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--op-white); color: var(--op-dark-green); border-radius: var(--op-radius-sm);
  padding: 2px 7px; font-size: 11px; font-weight: 700; box-shadow: var(--op-elevation-1);
}
.bar.lost { border-style: dashed; border-color: var(--op-chip-error-text); background: var(--op-white); }
.lost-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--op-radius-full);
  background: var(--op-chip-error-bg); color: var(--op-chip-error-text); font-size: 11px; font-weight: 700;
}
.lost-tag svg { width: 10px; height: 10px; }
.empty { padding: 36px 0; text-align: center; color: var(--op-silver-light); }
.empty b { display: block; font-family: var(--op-font-display); font-weight: 600; color: var(--op-dark-green); margin-bottom: 4px; }

/* ---------- Pagination ---------- */
.pager {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  border-top: 1px solid var(--op-border-divider); margin-top: 10px; padding-top: 14px;
}
.showing { margin: 0; color: var(--op-silver-light); }
.showing b { color: var(--op-dark-green); }
.pager-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.per-page { display: inline-flex; align-items: center; gap: 8px; color: var(--op-silver-dark); }
.per-page select {
  font: inherit; color: var(--op-dark-green); font-weight: 700; cursor: pointer;
  border: 1.5px solid var(--op-border-input); border-radius: var(--op-radius-md); padding: 6px 8px; background: var(--op-white);
}
.pages { display: flex; align-items: center; gap: 6px; }
.pg {
  min-width: 36px; height: 36px; padding: 0 10px; cursor: pointer;
  border: 1.5px solid var(--op-dark-green); background: var(--op-white); color: var(--op-dark-green);
  border-radius: var(--op-radius-md); font-family: var(--op-font-display); font-weight: 600; font-size: 13px;
}
.pg:hover:not(:disabled):not(.on) { background: var(--op-dark-green); color: var(--op-accent-lime); }
.pg.on { background: var(--op-dark-green); color: var(--op-accent-lime); }
.pg:disabled { border-color: var(--op-border-card); color: var(--op-silver-light); cursor: not-allowed; }
.gap { color: var(--op-silver-light); padding: 0 2px; }

/* ---------- Drawer ---------- */
.drawer-host { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(2,56,25,.45); opacity: 0; transition: opacity .2s; }
.drawer {
  position: relative; width: min(600px, 100%); height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  background: var(--op-white); box-shadow: var(--op-elevation-3);
  transform: translateX(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
.drawer-host.open .scrim { opacity: 1; }
.drawer-host.open .drawer { transform: none; }
.drawer-head {
  position: sticky; top: 0; z-index: 1; background: var(--op-white);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 22px 22px 14px; border-bottom: 1px solid var(--op-border-divider);
}
.drawer-head h3 { margin: 0; font-family: var(--op-font-display); font-weight: 600; font-size: 20px; color: var(--op-dark-green); }
.drawer-head p { margin: 4px 0 0; color: var(--op-silver-light); }
.icon-btn {
  width: 36px; height: 36px; border-radius: var(--op-radius-md); flex-shrink: 0; cursor: pointer;
  background: var(--op-chip-neutral-bg); border: 0; color: var(--op-dark-green);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.drawer-body { padding: 16px 22px 20px; flex: 1; }
/* Drawer: summary */
.dfacts { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 12px 16px; margin: 0 0 14px; }
.dfacts dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--op-silver-light); margin-bottom: 4px; }
.dfacts dd { margin: 0; color: var(--op-silver-dark); font-size: 14px; }
.dfacts .money { font-family: var(--op-font-display); font-weight: 600; color: var(--op-chip-warning-text); }
.dchips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.dchip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--op-radius-sm); font-size: 12px; font-weight: 700; }
.dchip svg { width: 10px; height: 10px; }
.dchip-phase { background: var(--op-dark-green); color: var(--op-white); }
.dchip-lost { background: var(--op-chip-error-bg); color: var(--op-chip-error-text); }
.dchip-count { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); border: 1px solid rgba(15,122,69,.35); font-weight: 600; }
.key {
  display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 -22px 4px; padding: 9px 22px; list-style: none;
  background: rgba(209, 219, 189, .35); border-block: 1px solid var(--op-border-divider); font-size: 11px; color: var(--op-silver-dark);
}
.key li { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid; }
.key .k-done { background: var(--op-dark-green); border-color: var(--op-dark-green); }
.key .k-progress { background: var(--op-accent-lime); border-color: var(--op-dark-green); }
.key .k-overdue { border-color: var(--op-error); }
.key .k-waiting { border-color: var(--op-gold); }
.key .k-todo { border-color: var(--op-border-input); }
/* Drawer: phases and step rows */
.phase { padding: 14px 0 6px; }
.phase + .phase { border-top: 1px solid var(--op-border-divider); }
.phase-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.phase-head h4 { margin: 0; flex-shrink: 0; min-width: 96px; font-family: var(--op-font-display); font-weight: 600; font-size: 14px; color: var(--op-dark-green); }
.pbar { flex: 1; height: 4px; border-radius: 2px; background: var(--op-chip-neutral-bg); overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--op-dark-green); border-radius: 2px; }
.pcount { flex-shrink: 0; font-size: 12px; color: var(--op-silver-dark); }
.srows { list-style: none; margin: 0; padding: 0; }
.srow {
  display: grid; grid-template-columns: 26px minmax(0, 1.35fr) minmax(0, 1fr) 104px 108px;
  grid-template-areas: "m n o t s"; gap: 4px 10px; align-items: center;
  padding: 9px 10px; margin: 0 -10px; border-radius: var(--op-radius-md);
}
.srow.current, .srow.overdue, .srow.waiting { background: rgba(209, 219, 189, .4); }
.smark {
  grid-area: m; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--op-border-input); background: var(--op-white);
  display: flex; align-items: center; justify-content: center; color: var(--op-white);
}
.smark svg { width: 11px; height: 11px; }
.srow.done .smark { background: var(--op-dark-green); border-color: var(--op-dark-green); }
.srow.current .smark { background: var(--op-accent-lime); border: 2px solid var(--op-dark-green); }
.srow.overdue .smark { border: 2px solid var(--op-error); }
.srow.waiting .smark { border: 2px solid var(--op-gold); }
.srow.lost .smark { background: var(--op-chip-error-bg); border-color: var(--op-chip-error-text); color: var(--op-chip-error-text); }
.sname { grid-area: n; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.sname > span, .sname > a { font-family: var(--op-font-display); font-weight: 600; font-size: 13px; color: var(--op-dark-green); line-height: 1.3; }
.srow.todo .sname > span { color: var(--op-silver-dark); font-weight: 500; }
.sname > span.role {
  font-family: var(--op-font-body); font-size: 10px; font-weight: 600; line-height: 1.5; padding: 0 6px; border-radius: 4px;
  background: var(--op-chip-neutral-bg); color: var(--op-chip-neutral-text);
}
.srow.todo .sname > span:not(.role) { color: var(--op-silver-light); }
.sowner { grid-area: o; min-width: 0; font-size: 13px; color: var(--op-silver-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stime { grid-area: t; font-size: 12px; color: var(--op-silver-dark); line-height: 1.35; }
.srow.todo .stime { color: var(--op-silver-light); }
.sstat { grid-area: s; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.sstat small { font-size: 11px; color: var(--op-silver-light); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--op-radius-sm); border: 1px solid; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--op-white); }
.pill-done, .pill-ontime { color: var(--op-chip-success-text); border-color: rgba(15,122,69,.45); background: var(--op-chip-success-bg); }
.pill-late, .pill-overdue { color: var(--op-chip-error-text); border-color: rgba(204,20,20,.45); background: var(--op-chip-error-bg); }
.pill-progress { color: var(--op-dark-green); border-color: var(--op-dark-green); background: rgba(191, 251, 79, .45); }
.pill-waiting { color: var(--op-chip-warning-text); border-color: rgba(138,106,0,.45); background: var(--op-chip-warning-bg); }
.pill-lost { color: var(--op-white); border-color: var(--op-chip-error-text); background: var(--op-chip-error-text); }
.pill-todo { color: var(--op-silver-dark); border-color: var(--op-border-input); background: var(--op-chip-neutral-bg); }
.drawer-foot {
  position: sticky; bottom: 0; padding: 10px 22px; background: var(--op-white); border-top: 1px solid var(--op-border-divider);
  font-size: 11px; color: var(--op-silver-light);
}
@media (max-width: 560px) {
  .dfacts { grid-template-columns: 1fr 1fr; }
  .srow { grid-template-columns: 26px minmax(0, 1fr) auto; grid-template-areas: "m n s" ". o t"; }
  .stime { text-align: right; }
  .sstat { align-items: flex-end; }
}
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: var(--op-radius-sm); }
.chip-primary { background: var(--op-chip-primary-bg); color: var(--op-chip-primary-text); }
.chip-error { background: var(--op-chip-error-bg); color: var(--op-chip-error-text); }
.chip-warning { background: var(--op-chip-warning-bg); color: var(--op-chip-warning-text); }
.chip-mode { background: var(--op-chip-mode-bg); color: var(--op-chip-mode-text); }
.notice { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--op-radius-lg); padding: 12px 14px; margin-bottom: 18px; line-height: 1.45; }
.notice .dot { margin-top: 6px; }
.notice-error { background: var(--op-chip-error-bg); color: var(--op-chip-error-text); }
.notice-warning { background: var(--op-chip-warning-bg); color: var(--op-chip-warning-text); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 0 0 22px; }
.facts dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--op-silver-light); margin-bottom: 3px; }
.facts dd { margin: 0; color: var(--op-silver-dark); font-size: 14px; }
.facts .money { font-family: var(--op-font-display); font-weight: 600; color: var(--op-chip-warning-text); }
.eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--op-silver-light); }
.steps { list-style: none; margin: 0; padding: 0; }
.step-phase { margin: 14px 0 6px; font-family: var(--op-font-display); font-weight: 600; font-size: 13px; color: var(--op-dark-green); }
.step-phase:first-child { margin-top: 0; }
.step { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--op-silver-light); }
.step i {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid var(--op-border-input);
  display: flex; align-items: center; justify-content: center; font-style: normal;
}
.step i svg { width: 11px; height: 11px; }
.step.done { color: var(--op-silver-dark); }
.step.done i { background: var(--op-dark-green); border-color: var(--op-dark-green); color: var(--op-accent-lime); }
.step.current { color: var(--op-dark-green); font-weight: 700; }
.step.current i { background: var(--op-accent-lime); border: 2px solid var(--op-dark-green); }
.step.lost i { background: var(--op-chip-error-bg); border-color: var(--op-chip-error-text); color: var(--op-chip-error-text); }
.step.lost { color: var(--op-chip-error-text); font-weight: 700; }
.step { align-items: flex-start; }
.step i { margin-top: 1px; }
.step-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.step-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; font-weight: 400; color: var(--op-silver-light); }
.step-link {
  color: var(--op-dark-green); font-weight: 700; text-decoration: none;
  border-bottom: 1.5px solid var(--op-dark-green); align-self: flex-start;
  display: inline-flex; align-items: center; gap: 4px;
}
.step-link svg { width: 12px; height: 12px; }
.step-link:hover { background: var(--op-accent-lime); }
.step-meta b { font-weight: 600; color: var(--op-silver-dark); }
.step-meta time { white-space: nowrap; }
.avatar {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--op-font-display); font-weight: 600; font-size: 8px; letter-spacing: .02em;
}
.avatar-1 { background: var(--op-avatar-1-bg); color: var(--op-avatar-1-text); }
.avatar-2 { background: var(--op-avatar-2-bg); color: var(--op-avatar-2-text); }
.avatar-3 { background: var(--op-avatar-3-bg); color: var(--op-avatar-3-text); }
.avatar-4 { background: var(--op-avatar-4-bg); color: var(--op-avatar-4-text); }

/* ---------- Responsive ---------- */
@media (max-width: 700px) {
  .shell { flex-direction: column; }
  .rail {
    width: 100%; height: auto; position: sticky; top: 0; z-index: 20; flex-direction: row;
    padding: 10px max(16px, env(safe-area-inset-left, 0px));
  }
  .rail-mark { margin: 0 8px 0 0; }
  .main { padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tracker { padding: 16px 14px 12px; }
  .search { width: 100%; }
}

</style>
</head>
<body>
  <div class="shell">
    <!-- Navigation rail -->
    <nav class="rail" aria-label="Main">
      <span class="rail-mark" aria-hidden="true">OP</span>
      <a class="rail-btn active" href="#" aria-current="page" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      </a>
      <a class="rail-btn" href="crm.html" aria-label="CRM board" title="CRM board">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="10" y="4" width="5" height="10" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="17" y="4" width="4" height="13" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </a>
      <a class="rail-btn" href="rfq.html" aria-label="RFQ" title="RFQ">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </a>
      <a class="rail-btn" href="quotes.html" aria-label="Quotes" title="Quotes">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      <a class="rail-btn" href="#" aria-label="Analytics" title="Analytics">
        <svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M9 16v-5M14 16V8M19 16v-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </a>
      <span class="rail-spacer"></span>
      <a class="rail-btn" href="#" aria-label="Finance" title="Finance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.4c0 3.3 6 1.8 6 5.1 0 1.4-1.3 2.5-3 2.5s-3-1.1-3-2.5M12 5.5v13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </a>
    </nav>

    <main class="main">
      <!-- Shipment tracker -->
      <section class="tracker" aria-labelledby="trackerTitle">
        <div class="tracker-head">
          <div class="tracker-title">
            <h2 id="trackerTitle">Shipments</h2>
            <div class="filter-chip" id="filterChip" hidden>
              <span id="filterLabel"></span>
              <button type="button" id="clearFilter" aria-label="Clear filter">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" id="search" placeholder="Search ID or customer" autocomplete="off" />
          </label>
        </div>

        <ul class="legend" aria-label="Legend">
          <li><span class="sw sw-done"></span>Completed</li>
          <li><span class="sw sw-current"></span>In progress</li>
          <li><span class="sw sw-todo"></span>Not started</li>
          <li><span class="sw sw-lost"></span>Lost</li>
          <li><span class="dot dot-error"></span>Delayed or overdue</li>
          <li><span class="dot dot-warning"></span>Waiting on someone</li>
        </ul>

        <div class="table-wrap">
          <div class="track-table">
            <div class="track-row track-header" aria-hidden="true">
              <span>Shipment</span>
              <div class="phases" id="phaseHeaders"></div>
            </div>
            <div id="rows"></div>
          </div>
        </div>

        <footer class="pager">
          <p class="showing" id="showing"></p>
          <div class="pager-right">
            <label class="per-page">Rows per page
              <select id="perPage">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
            </label>
            <nav class="pages" id="pages" aria-label="Pages"></nav>
          </div>
        </footer>
      </section>
    </main>
  </div>

  <!-- Shipment detail drawer -->
  <div class="drawer-host" id="drawer" hidden>
    <div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-head">
        <div>
          <h3 id="drawerTitle"></h3>
          <p id="drawerSub"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
      <footer class="drawer-foot">Times in Lagos time (WAT). Targets per step are examples.</footer>
    </aside>
  </div>

  <script>
(function () {
  "use strict";

  // ---------- Pipeline definition ----------
  // Each phase and its steps, with the number of live shipments sitting in each step.
  var ICONS = {
    inbox: '<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/>',
    calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12v5M8 16h2M12 16h2"/>',
    doc: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    percent: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
    folder: '<path d="M3 6h6l2 2h10v11H3z"/><path d="M12 11v5M9.5 13.5h5"/>',
    calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/>',
    ship: '<path d="M3 16l2 4h14l2-4zM6 16V9h12v7M12 9V4M9 6h6"/>',
    customs: '<path d="M7 21v-6M17 21v-6M4 15h16M6 15V9h12v6M9 9V5h6v4"/>',
    scale: '<path d="M12 4v16M6 20h12M5 8h14M5 8l-2.5 6h5zM19 8l-2.5 6h5z"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',
    truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M12 11v5M9.5 13.5h5"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
    box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>'
  };
  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + "</svg>";
  }
  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

  var PHASES = [
    { id: "prospect", name: "Prospect", bar: "var(--op-cat-2)", steps: [
      ["Deal created", 6, "briefcase"], ["Customer contacted", 9, "phone"], ["RFQ", 25, "inbox"], ["Rate request", 5, "calc"], ["Quote issued", 5, "doc"],
      ["Qualification & credit", 11, "shield"], ["Margin gate", 7, "percent"], ["Customer acceptance", 5, "check"]] },
    { id: "pre", name: "Pre-Booking", bar: "var(--op-cat-3)", steps: [
      ["Credit & payment terms", 14, "card"], ["Job opened", 15, "folder"]] },
    { id: "booking", name: "Booking", bar: "var(--op-cat-4)", steps: [
      ["Booking", 7, "calendar"], ["Origin & sailing", 11, "ship"], ["Pre-arrival & clearing", 9, "customs"]] },
    { id: "post", name: "Post Booking", bar: "var(--op-cat-5)", steps: [
      ["Cost-to-bill check", 7, "scale"], ["Invoicing & collection", 5, "receipt"], ["Delivery & documents", 5, "truck"], ["Job close & review", 9, "star"]] }
  ];
  // Flat list of steps in pipeline order
  var STEPS = [];
  PHASES.forEach(function (p, pi) {
    p.steps.forEach(function (s) { STEPS.push({ name: s[0], count: s[1], icon: s[2], phase: pi }); });
  });
  function stepIndex(name) { for (var i = 0; i < STEPS.length; i++) if (STEPS[i].name === name) return i; return -1; }

  var ALERTS = [
    { id: "delayed", n: 4, label: "delayed", sev: "error", steps: ["Origin & sailing", "Pre-arrival & clearing"],
      detail: "Vessel departure slipped by 3 days. Customer has not been updated on the new ETA." },
    { id: "quotes", n: 2, label: "quotes awaiting reply", one: "quote awaiting reply", sev: "warning", steps: ["Quote issued"],
      detail: "Quote sent 4 days ago with no reply from the customer." },
    { id: "hold", n: 1, label: "hold expiring", sev: "warning", steps: ["Booking"],
      detail: "Space hold with the carrier expires today at 17:00." },
    { id: "carrier", n: 2, label: "awaiting carrier", sev: "warning", steps: ["Booking"],
      detail: "Booking request sent; waiting for the carrier to confirm space." },
    { id: "overdue", n: 3, label: "invoices overdue", one: "invoice overdue", sev: "error", steps: ["Invoicing & collection"],
      detail: "Invoice is 9 days past its due date." }
  ];
  function alertById(id) { return ALERTS.filter(function (a) { return a.id === id; })[0]; }
  var LOST_COUNT = 11;

  // ---------- Sample shipments ----------
  var CUSTOMERS = ["Sterling bank", "Kliqs consulting", "Limeswood", "Micro press computers ltd", "Agventure commodities limited",
    "Cdk industries", "Autochek", "Broadgrain africa", "Silver star", "Bejoice shipping", "Goshen agro", "Greenbles agtech",
    "Premium agro commodities export", "Sinopec oilfield equipment", "Gz industries ltd", "Flavors & fragrance"];
  var OWNERS = ["Aishat Jimoh", "Kayode Akintade", "Deborah Oje", "Adeshewa Adelowotan", "Gift Osaremen"];
  // Who handles each step: the deal owner, or the team that owns that step
  var TEAMS = {
    pricing: ["Tunde Bakare", "Ifeoma Nwosu"],
    finance: ["Chidi Okafor", "Bisi Adeyemi"],
    ops: ["Emeka Obi", "Halima Yusuf", "Femi Lawal"]
  };
  // Where the RFQ step in the shipment drawer links to: the backoffice RFQ table
  var RFQ_TABLE_URL = "rfq.html";
  // Where the Prospect heading in the shipment drawer links to: the CRM pipeline board
  var CRM_BOARD_URL = "crm.html";
  // Where the Quote issued step links to: the quotes page, opened on that quote
  var QUOTES_URL = "quotes.html";
  var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var STEP_TEAM = {
    "Rate request": "pricing", "Margin gate": "pricing",
    "Qualification & credit": "finance", "Credit & payment terms": "finance",
    "Cost-to-bill check": "finance", "Invoicing & collection": "finance",
    "Booking": "ops", "Origin & sailing": "ops", "Pre-arrival & clearing": "ops", "Delivery & documents": "ops"
  };
  var ROUTES = [["Shanghai", "Apapa"], ["Ningbo", "Tin Can"], ["Antwerp", "Apapa"], ["Lagos", "Rotterdam"], ["Dubai (Jebel Ali)", "Onne"],
    ["Mumbai (Nhava Sheva)", "Apapa"], ["Lagos (LOS)", "London (LHR)"], ["Guangzhou", "Lekki Deep Sea"]];
  var LOST_REASONS = ["Customer chose a cheaper forwarder", "Rate not competitive", "Shipment cancelled by customer", "No response after follow-ups", "Credit check failed"];

  var seed = 26111;
  function rand() { // deterministic, so every viewer sees the same sample data
    seed = (seed * 1103515245 + 12345) % 2147483648;
    return seed / 2147483648;
  }
  function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

  function buildShipments() {
    var remaining = STEPS.map(function (s) { return s.count; });
    var lostLeft = LOST_COUNT;
    // A hand-picked first page so the opening view shows each state
    var first = [["Credit & payment terms"], ["Origin & sailing", "delayed"], ["RFQ"], ["Rate request"],
      ["Invoicing & collection", "overdue"], ["Quote issued", "quotes"], ["Margin gate"], ["Booking", "hold"], ["LOST"], ["Customer acceptance"]];
    var plan = first.map(function (f) {
      if (f[0] === "LOST") { lostLeft--; return { lost: true }; }
      var i = stepIndex(f[0]); remaining[i]--;
      return { step: i, alert: f[1] || null };
    });
    var pool = [];
    remaining.forEach(function (n, i) { for (var k = 0; k < n; k++) pool.push({ step: i, alert: null }); });
    for (var k = 0; k < lostLeft; k++) pool.push({ lost: true });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    plan = plan.concat(pool);

    // Spread the remaining alerts over eligible shipments
    ALERTS.forEach(function (a) {
      var have = plan.filter(function (p) { return p.alert === a.id; }).length;
      var eligible = plan.filter(function (p) { return !p.lost && !p.alert && a.steps.indexOf(STEPS[p.step].name) !== -1; });
      while (have < a.n && eligible.length) {
        var e = eligible.splice(Math.floor(rand() * eligible.length), 1)[0];
        e.alert = a.id; have++;
      }
    });

    return plan.map(function (p, i) {
      var route = pick(ROUTES);
      var day = 1 + Math.floor(rand() * 9);
      return {
        id: "OP-26-11-" + String(i + 1).padStart(3, "0"),
        customer: CUSTOMERS[(i * 7 + 3) % CUSTOMERS.length],
        owner: OWNERS[(i * 3 + 1) % OWNERS.length],
        value: Math.round((800 + rand() * 18000) / 5) * 5,
        mode: route[1].indexOf("(") !== -1 ? "Air freight" : "Ocean freight",
        route: route[0] + " → " + route[1],
        created: String(day).padStart(2, "0") + "/11/2026",
        lost: !!p.lost,
        lostStep: p.lost ? Math.floor(rand() * PHASES[0].steps.length) : null,
        lostReason: p.lost ? pick(LOST_REASONS) : null,
        step: p.lost ? null : p.step,
        phase: p.lost ? 0 : STEPS[p.step].phase,
        alert: p.alert || null
      };
    });
  }
  // OP-26-11-004 (Silver star, Rate request) removed from the sample list
  var SHIPMENTS = buildShipments().filter(function (s) { return s.id !== "OP-26-11-004"; });

  // Newest shipment: deal created by Deborah, customer then contacted by Kayode
  (function () {
    var last = SHIPMENTS.reduce(function (m, s) { return Math.max(m, +s.id.slice(-3)); }, 0);
    SHIPMENTS.unshift({
      id: "OP-26-11-" + String(last + 1).padStart(3, "0"),
      customer: "Srtc exim ltd", owner: "Deborah Oje", value: 3330,
      mode: "Ocean freight", route: "Shanghai → Apapa", created: "10/11/2026",
      lost: false, lostStep: null, lostReason: null,
      step: stepIndex("Customer contacted"), phase: 0, alert: null,
      history: [
        { owner: "Deborah Oje", at: new Date(2026, 10, 10, 9, 12), label: "Deal created" },
        { owner: "Kayode Akintade", at: new Date(2026, 10, 10, 11, 40), label: "Contacted" }
      ]
    });
  })();

  // ---------- Helpers ----------
  function setCreated(s) {
    var c = stepHistory(s)[0].at;
    s.createdAt = c;
    s.created = String(c.getDate()).padStart(2, "0") + "/" + String(c.getMonth() + 1).padStart(2, "0") + "/" + c.getFullYear();
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return "$" + Number(n).toLocaleString("en-US"); }

  // ---------- State ----------
  var state = { filter: { kind: "all" }, page: 1, perPage: 10, q: "" };
  function sameFilter(a, b) { return a.kind === b.kind && a.value === b.value; }
  function setFilter(f) {
    state.filter = sameFilter(state.filter, f) ? { kind: "all" } : f; // clicking the active filter clears it
    state.page = 1;
    render();
  }
  function matchesFilter(s) {
    var f = state.filter;
    if (f.kind === "all") return true;
    if (f.kind === "active") return !s.lost;
    if (f.kind === "lost") return s.lost;
    if (f.kind === "phase") return !s.lost && s.phase === f.value;
    if (f.kind === "step") return !s.lost && s.step === f.value;
    if (f.kind === "alert") return s.alert === f.value;
    return true;
  }
  function filterLabel() {
    var f = state.filter;
    if (f.kind === "active") return "Active shipments";
    if (f.kind === "lost") return "Lost prospects";
    if (f.kind === "phase") return PHASES[f.value].name;
    if (f.kind === "step") return PHASES[STEPS[f.value].phase].name + " · " + STEPS[f.value].name;
    if (f.kind === "alert") { var a = alertById(f.value); return a.label.charAt(0).toUpperCase() + a.label.slice(1); }
    return "";
  }

  // ---------- Tracker ----------
  $("phaseHeaders").innerHTML = PHASES.map(function (p) { return "<span>" + esc(p.name) + "</span>"; }).join("");

  function barHtml(s) {
    if (s.lost) {
      return '<div class="bar lost"><span class="seg"><span class="lost-tag">' + CROSS + "Lost</span></span><span class=\"seg\"></span><span class=\"seg\"></span><span class=\"seg\"></span></div>";
    }
    return '<div class="bar">' + PHASES.map(function (p, pi) {
      if (pi < s.phase) return '<span class="seg seg-done"></span>';
      if (pi === s.phase) return '<span class="seg seg-current"><span class="seg-label">' + esc(STEPS[s.step].name) + "</span></span>";
      return '<span class="seg"></span>';
    }).join("") + "</div>";
  }
  function statusText(s) {
    return s.lost ? "Lost at " + STEPS[s.lostStep].name : PHASES[s.phase].name + ", " + STEPS[s.step].name;
  }

  function filtered() {
    var q = state.q.toLowerCase();
    return SHIPMENTS.filter(function (s) {
      return matchesFilter(s) && (!q || (s.id + " " + s.customer).toLowerCase().indexOf(q) !== -1);
    });
  }

  function renderTracker() {
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / state.perPage));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * state.perPage;
    var shown = list.slice(start, start + state.perPage);

    $("rows").innerHTML = shown.length ? shown.map(function (s) {
      var a = s.alert ? alertById(s.alert) : null;
      return '<button type="button" class="ship" data-ship="' + s.id + '" aria-label="' + esc(s.id + ", " + s.customer + ", " + statusText(s) + (a ? ", " + a.label : "")) + '">' +
        '<span class="ship-id"><b>' + esc(s.id) + (a ? '<span class="dot dot-' + a.sev + '" title="' + esc(a.label) + '"></span>' : "") + "</b>" +
        "<small>" + esc(s.customer) + "</small></span>" + barHtml(s) + "</button>";
    }).join("") : '<div class="empty"><b>No shipments match</b>Try another search or clear the filter.</div>';

    $("showing").innerHTML = list.length
      ? "Showing <b>" + (start + 1) + "–" + (start + shown.length) + "</b> of " + list.length
      : "Showing 0 of 0";

    // Prev 1 2 … 16 Next
    var nums = [];
    for (var p = 1; p <= pages; p++) {
      if (p === 1 || p === pages || Math.abs(p - state.page) <= 1 || (state.page <= 2 && p <= 3) || (state.page >= pages - 1 && p >= pages - 2)) nums.push(p);
      else if (nums[nums.length - 1] !== "…") nums.push("…");
    }
    $("pages").innerHTML =
      '<button type="button" class="pg" data-page="' + (state.page - 1) + '"' + (state.page === 1 ? " disabled" : "") + ">‹ Prev</button>" +
      nums.map(function (n) {
        return n === "…" ? '<span class="gap">…</span>'
          : '<button type="button" class="pg' + (n === state.page ? " on" : "") + '" data-page="' + n + '"' + (n === state.page ? ' aria-current="page"' : "") + ">" + n + "</button>";
      }).join("") +
      '<button type="button" class="pg" data-page="' + (state.page + 1) + '"' + (state.page === pages ? " disabled" : "") + ">Next ›</button>";

    $("filterChip").hidden = state.filter.kind === "all";
    $("filterLabel").textContent = filterLabel() + " · " + list.length;
  }

  $("pages").addEventListener("click", function (e) {
    var b = e.target.closest("[data-page]");
    if (!b || b.disabled) return;
    state.page = Number(b.getAttribute("data-page"));
    renderTracker();
  });
  $("perPage").addEventListener("change", function () { state.perPage = Number(this.value); state.page = 1; renderTracker(); });
  $("search").addEventListener("input", function () { state.q = this.value.trim(); state.page = 1; renderTracker(); });
  $("clearFilter").addEventListener("click", function () { state.filter = { kind: "all" }; state.page = 1; render(); });
  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest("[data-ship]");
    if (b) openDrawer(b.getAttribute("data-ship"));
  });

  // ---------- Step owners and completion times ----------
  function hash(str) { var x = 2166136261; for (var i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
  function stepOwner(s, si) {
    var name = STEPS[si].name;
    if (name === "Margin gate") return "CEO";
    if (name === "Customer acceptance") return s.customer;
    var team = STEP_TEAM[name];
    if (!team) return s.owner; // deal created, contacted, RFQ, quote, job opened, close: the deal owner
    var list = TEAMS[team];
    return list[hash(s.id + team) % list.length];
  }
  // Which team each step belongs to, and the target time for it (hours; examples)
  var STEP_ROLE = {
    "Deal created": "Sales", "Customer contacted": "Sales", "RFQ": "Sales", "Rate request": "Commercial", "Quote issued": "Sales",
    "Qualification & credit": "Finance", "Margin gate": "CEO", "Customer acceptance": "Customer",
    "Credit & payment terms": "Finance", "Job opened": "Sales",
    "Booking": "Operations", "Origin & sailing": "Operations", "Pre-arrival & clearing": "Operations",
    "Cost-to-bill check": "Finance", "Invoicing & collection": "Finance", "Delivery & documents": "Operations", "Job close & review": "Sales"
  };
  var TARGET_H = {
    "Deal created": 2, "Customer contacted": 4, "RFQ": 4, "Rate request": 24, "Quote issued": 8, "Qualification & credit": 24,
    "Margin gate": 4, "Customer acceptance": 72, "Credit & payment terms": 24, "Job opened": 8, "Booking": 48,
    "Origin & sailing": 336, "Pre-arrival & clearing": 120, "Cost-to-bill check": 24, "Invoicing & collection": 168,
    "Delivery & documents": 72, "Job close & review": 48
  };
  var HOUR = 3600000;
  var AS_OF = new Date(2026, 10, 10, 12, 0); // sample data is dated up to 10 Nov 2026

  // For steps 0..current: who handled it and when (completion time; for the current step, when it started;
  // for a lost shipment's last step, when it was lost). Built backwards from AS_OF so each step takes a
  // plausible time against its target. Cached on the shipment.
  function stepHistory(s) {
    if (s.history) return s.history; // recorded history for hand-entered shipments
    if (s._hist) return s._hist;
    var current = s.lost ? s.lostStep : s.step;
    var j = function (k) { return (hash(s.id + ":" + k) % 1000) / 1000; }; // 0..1, stable per shipment and step
    var target = function (k) { return TARGET_H[STEPS[k].name] * HOUR; };
    var a = s.alert ? alertById(s.alert) : null;
    var at = [];
    if (s.lost) {
      at[current] = AS_OF.getTime() - (1 + 4 * j("lost")) * 24 * HOUR;
      for (var k = current; k > 0; k--) at[k - 1] = at[k] - target(k) * (0.35 + j(k));
    } else {
      var f = a && a.sev === "error" ? 1.15 + 0.6 * j("e") : a ? 0.3 + 0.5 * j("e") : 0.15 + 0.95 * j("e");
      at[current] = AS_OF.getTime() - target(current) * f; // when the current step started
      if (current > 0) at[current - 1] = at[current];        // ...which is when the previous step completed
      for (var k2 = current - 1; k2 > 0; k2--) at[k2 - 1] = at[k2] - target(k2) * (0.35 + j(k2));
    }
    // Keep times within the working day (08:00-19:00), in order, and no later than AS_OF
    for (var n = 0; n < at.length; n++) {
      var d = new Date(at[n]);
      if (d.getHours() < 8) d.setHours(8, hash(s.id + "m" + n) % 50, 0, 0);
      else if (d.getHours() >= 19) { d.setDate(d.getDate() + 1); d.setHours(8, hash(s.id + "m" + n) % 50, 0, 0); }
      var t = d.getTime();
      if (n > 0 && t < at[n - 1] + 10 * 60000) t = at[n - 1] + (10 + hash(s.id + "g" + n) % 40) * 60000;
      at[n] = Math.min(t, AS_OF.getTime() - 5 * 60000);
    }
    s._hist = at.map(function (t, k) { return { owner: stepOwner(s, k), at: new Date(Math.round(t / 60000) * 60000) }; });
    return s._hist;
  }
  // Timing for one step: start, how long it took, when it is due, and its status
  function stepTiming(s, hist, si) {
    var current = s.lost ? s.lostStep : s.step;
    if (si > current) return { key: "todo", label: "Not started" };
    var h = hist[si];
    var start = si === 0 ? h.at : hist[si - 1].at;
    var target = TARGET_H[STEPS[si].name] * HOUR;
    var a = s.alert ? alertById(s.alert) : null;
    if (si < current || (si === current && h.label)) { // done (a recorded current step counts as done for timing)
      if (si === 0) return { key: "done", label: "Done" };
      var took = h.at - start;
      return { key: took <= target ? "ontime" : "late", label: took <= target ? "On time" : "Late", sub: "took " + fmtDur(took) };
    }
    if (si === current) {
      if (s.lost) return { key: "lost", label: "Lost", sub: "after " + fmtDur(h.at - start) };
      var due = new Date(h.at.getTime() + target);
      if (a && a.sev === "warning") return { key: "waiting", label: "Waiting", sub: a.one || a.label };
      if (AS_OF > due || (a && a.sev === "error")) return { key: "overdue", label: "Overdue", sub: "was due " + fmtShort(due) };
      return { key: "progress", label: "In progress", sub: "due " + fmtShort(due) };
    }
    return { key: "todo", label: "Not started" };
  }
  function fmtShort(dt) {
    return dt.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", " +
      dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function fmtDur(ms) {
    var m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    return d ? d + "d " + h + "h" : h ? h + "h " + mm + "m" : mm + "m";
  }
  function fmtDateTime(dt) {
    return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + ", " +
      dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function avatar(name) {
    var ini = name.split(" ").map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
    return '<span class="avatar avatar-' + (hash(name) % 4 + 1) + '" aria-hidden="true">' + esc(ini) + "</span>";
  }

  // ---------- Link to the CRM board ----------
  // Which CRM board column a shipment's deal sits in
  function crmStage(s) {
    if (s.lost) return "closed-lost";
    var name = STEPS[s.step].name;
    if (s.phase > 0 || name === "Customer acceptance") return "closed-won";
    return { "Deal created": "prospect", "Customer contacted": "contacted", "RFQ": "qualified",
      "Rate request": "qualified" }[name] || "quote";
  }
  // ---------- Link to the RFQ table ----------
  // Port codes as the RFQ table shows them (UN/LOCODE for ocean, IATA for air)
  var PORT_CODES = { "Shanghai": "CNSHA", "Apapa": "NGAPP", "Ningbo": "CNNGB", "Tin Can": "NGTIN", "Antwerp": "BEANR",
    "Lagos": "NGLOS", "Rotterdam": "NLRTM", "Dubai (Jebel Ali)": "AEJEA", "Onne": "NGONN", "Mumbai (Nhava Sheva)": "INNSA",
    "Lagos (LOS)": "LOS", "London (LHR)": "LHR", "Guangzhou": "CNCAN", "Lekki Deep Sea": "NGLKK" };
  // A shipment has an RFQ once it reaches the RFQ step (lost shipments: if lost at or after it)
  function rfqNumber(s) {
    var reached = s.lost ? s.lostStep : s.step;
    if (reached < stepIndex("RFQ")) return null;
    return "RFQ-26-11-" + String(8 + Number(s.id.slice(-3))).padStart(3, "0");
  }
  function rfqStatus(s) {
    if (s.lost) return ["Lost", "—"];
    var name = STEPS[s.step].name;
    if (name === "RFQ") return ["New", "—"];
    if (name === "Rate request") return ["Awaiting Quotes", "Draft"];
    return ["Quoted", "Ready"];
  }
  function rfqUrl(s) {
    var ports = s.route.split(" → ");
    var st = rfqStatus(s);
    var q = { deal: s.id, customer: s.customer };
    var no = rfqNumber(s);
    if (no) {
      q.rfq = no; q.service = s.mode.replace("freight", "Freight");
      q.pol = PORT_CODES[ports[0]] || ports[0]; q.pod = PORT_CODES[ports[1]] || ports[1];
      q.status = st[0]; q.quote = st[1];
    }
    return RFQ_TABLE_URL + "?" + Object.keys(q).map(function (k) { return k + "=" + encodeURIComponent(q[k]); }).join("&");
  }

  // ---------- Link to the quote ----------
  var PORT_COUNTRIES = { "Shanghai": "China", "Apapa": "Nigeria", "Ningbo": "China", "Tin Can": "Nigeria", "Antwerp": "Belgium",
    "Lagos": "Nigeria", "Rotterdam": "Netherlands", "Dubai (Jebel Ali)": "U.A.E.", "Onne": "Nigeria", "Mumbai (Nhava Sheva)": "India",
    "Lagos (LOS)": "Nigeria", "London (LHR)": "United Kingdom", "Guangzhou": "China", "Lekki Deep Sea": "Nigeria" };
  // A shipment has a quote once it reaches Quote issued; it shares its number with the RFQ
  function quoteNumber(s) {
    var reached = s.lost ? s.lostStep : s.step;
    if (reached < stepIndex("Quote issued")) return null;
    return "Q-26-11-" + String(8 + Number(s.id.slice(-3))).padStart(3, "0");
  }
  function quoteStatus(s) {
    if (s.lost) return "Declined";
    return s.phase > 0 || STEPS[s.step].name === "Customer acceptance" ? "Accepted" : "Awaiting customer";
  }
  function quoteUrl(s, hist) {
    var q = { deal: s.id, customer: s.customer };
    var no = quoteNumber(s);
    if (no) {
      var ports = s.route.split(" → ");
      var at = hist[stepIndex("Quote issued")].at;
      q.quote = no; q.rfq = rfqNumber(s); q.rfqlink = rfqUrl(s); q.mode = s.mode; q.owner = s.owner; q.value = s.value; q.status = quoteStatus(s);
      q.pol = ports[0] + ", " + (PORT_COUNTRIES[ports[0]] || ""); q.polcode = PORT_CODES[ports[0]] || "";
      q.pod = ports[1] + ", " + (PORT_COUNTRIES[ports[1]] || ""); q.podcode = PORT_CODES[ports[1]] || "";
      q.issued = at.getFullYear() + "-" + String(at.getMonth() + 1).padStart(2, "0") + "-" + String(at.getDate()).padStart(2, "0") +
        "T" + String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
    }
    return QUOTES_URL + "?" + Object.keys(q).map(function (k) { return k + "=" + encodeURIComponent(q[k]); }).join("&");
  }

  function crmUrl(s, hist) {
    var lastStep = Math.min(s.lost ? s.lostStep : s.step, PHASES[0].steps.length - 1);
    var h = hist[lastStep];
    var current = s.lost ? s.lostStep : s.step;
    var verb = h.label || (s.lost && lastStep === current ? "Lost" :
      STEPS[lastStep].name + (lastStep < current ? " completed" : " started"));
    var q = { deal: s.id, customer: s.customer, owner: s.owner, value: s.value, stage: crmStage(s),
      note: verb + " by " + h.owner + " · " + fmtDateTime(h.at), created: s.created.replace(/\//g, "-") };
    var rfq = rfqNumber(s);
    if (rfq) { q.rfq = rfq; q.rfqlink = rfqUrl(s); }
    var quote = quoteNumber(s);
    if (quote) { q.quote = quote; q.quotelink = quoteUrl(s, hist); }
    return CRM_BOARD_URL + "?" + Object.keys(q).map(function (k) { return k + "=" + encodeURIComponent(q[k]); }).join("&");
  }

  // ---------- Detail drawer ----------
  var lastFocus = null;
  function openDrawer(id) {
    var s = SHIPMENTS.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    lastFocus = document.activeElement;
    var a = s.alert ? alertById(s.alert) : null;
    $("drawerTitle").textContent = s.id;
    $("drawerSub").textContent = s.customer;

    var notice = a ? '<div class="notice notice-' + a.sev + '"><span class="dot dot-' + a.sev + '"></span><div><b>' +
      esc(a.label.charAt(0).toUpperCase() + a.label.slice(1)) + "</b><br>" + esc(a.detail) + "</div></div>" : "";
    if (s.lost) notice = '<div class="notice notice-error"><span class="dot dot-error"></span><div><b>Lost at ' + esc(STEPS[s.lostStep].name) +
      "</b><br>" + esc(s.lostReason) + "</div></div>";

    var current = s.lost ? s.lostStep : s.step;
    var hist = stepHistory(s);
    var doneCount = s.lost ? current : current + (hist[current] && hist[current].label ? 1 : 0);
    var phaseChip = s.lost
      ? '<span class="dchip dchip-lost">' + CROSS + " Lost at " + esc(STEPS[s.lostStep].name) + "</span>"
      : '<span class="dchip dchip-phase">' + esc(PHASES[s.phase].name) + " · " + esc(STEPS[s.step].name) + "</span>";

    var phases = PHASES.map(function (p, pi) {
      var idx = STEPS.map(function (st, si) { return si; }).filter(function (si) { return STEPS[si].phase === pi; });
      var done = idx.filter(function (si) { return si < doneCount; }).length;
      var head = pi === 0
        ? '<a class="step-link" href="' + esc(crmUrl(s, hist)) + '" title="Open this deal on the CRM board">' + esc(p.name) + ARROW + "</a>"
        : esc(p.name);
      var rows = idx.map(function (si) {
        var st = STEPS[si];
        var t = stepTiming(s, hist, si);
        var cls = si < current ? "done" : si > current ? "todo" : t.key === "lost" ? "lost" : t.key === "overdue" ? "overdue" : t.key === "waiting" ? "waiting" : "current";
        if (si === current && hist[si] && hist[si].label && !s.lost) cls = "current";
        var mark = cls === "done" ? CHECK : cls === "lost" ? CROSS : "";
        var name = st.name === "RFQ"
          ? '<a class="step-link" href="' + esc(rfqUrl(s)) + '" title="Open the RFQ table">' + esc(st.name) + ARROW + "</a>"
          : st.name === "Quote issued"
          ? '<a class="step-link" href="' + esc(quoteUrl(s, hist)) + '" title="Open the quote">' + esc(st.name) + ARROW + "</a>"
          : "<span>" + esc(st.name) + "</span>";
        var time = "—";
        if (si <= current) {
          var hh = hist[si];
          var prefix = hh.label && si === current ? hh.label + " " : si < current ? "" : s.lost ? "Lost " : "Started ";
          time = '<time datetime="' + hh.at.toISOString() + '">' + esc(prefix) + fmtShort(hh.at) + "</time>";
        }
        var owner = si <= current ? hist[si].owner : stepOwner(s, si);
        return '<li class="srow ' + cls + '"><span class="smark" aria-hidden="true">' + mark + "</span>" +
          '<span class="sname">' + name + '<span class="role">' + esc(STEP_ROLE[st.name] || "") + "</span></span>" +
          '<span class="sowner">' + esc(owner) + "</span>" +
          '<span class="stime">' + time + "</span>" +
          '<span class="sstat"><span class="pill pill-' + t.key + '">' + esc(t.label) + "</span>" + (t.sub ? "<small>" + esc(t.sub) + "</small>" : "") + "</span></li>";
      }).join("");
      return '<section class="phase" aria-label="' + esc(p.name) + '"><div class="phase-head"><h4>' + head + "</h4>" +
        '<span class="pbar" aria-hidden="true"><span style="width:' + Math.round(100 * done / idx.length) + '%"></span></span>' +
        '<span class="pcount">' + done + " of " + idx.length + "</span></div>" +
        '<ul class="srows">' + rows + "</ul></section>";
    }).join("");

    $("drawerBody").innerHTML =
      '<dl class="dfacts">' +
      "<div><dt>Route</dt><dd>" + esc(s.route) + " (" + (/air/i.test(s.mode) ? "air" : "ocean") + ")</dd></div>" +
      '<div><dt>Deal value</dt><dd class="money">' + money(s.value) + "</dd></div>" +
      "<div><dt>Deal owner</dt><dd>" + esc(s.owner) + "</dd></div>" +
      "<div><dt>Created</dt><dd>" + fmtShort(s.createdAt || hist[0].at) + "</dd></div></dl>" +
      '<div class="dchips">' + phaseChip + '<span class="dchip dchip-count">' + doneCount + " of " + STEPS.length + " done</span></div>" + notice +
      '<ul class="key" aria-label="Key"><li><i class="k-done"></i>Completed</li><li><i class="k-progress"></i>In progress</li>' +
      '<li><i class="k-overdue"></i>Overdue</li><li><i class="k-waiting"></i>Waiting on someone</li><li><i class="k-todo"></i>Not started</li></ul>' +
      phases;

    var host = $("drawer");
    host.hidden = false;
    void host.offsetWidth;
    host.classList.add("open");
    host.querySelector(".icon-btn").focus();
  }
  function closeDrawer() {
    var host = $("drawer");
    host.classList.remove("open");
    setTimeout(function () { if (!host.classList.contains("open")) host.hidden = true; }, 250);
    if (lastFocus) lastFocus.focus();
  }
  $("drawer").addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeDrawer(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("drawer").hidden) closeDrawer();
  });

  SHIPMENTS.forEach(setCreated); // created = when the deal was created in the step history
  function render() { renderTracker(); }
  render();
})();

</script>
</body>
</html>
