<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnePort365 CRM Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="design/tokens.css" />
  <style>
/*
  OnePort365 CRM — Pipeline board.
  Mirrors the backoffice CRM Pipeline screen, built on design/tokens.css.
  Opened from a shipment's "Prospect" link with
  ?deal=&customer=&owner=&value=&stage=&note=&created=&rfq=&rfqlink=
  — that deal is placed in its stage and highlighted.
*/
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--op-cream); color: var(--op-silver-dark);
  font-family: var(--op-font-body); font-size: 14px; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--op-dark-green); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Shell ---------- */
.shell { display: flex; min-height: 100%; }
.rail {
  width: 72px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; background: var(--op-dark-green);
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0;
}
.rail-mark {
  width: 40px; height: 40px; border-radius: 12px; margin-bottom: 14px; background: var(--op-accent-lime); color: var(--op-dark-green);
  display: flex; align-items: center; justify-content: center; font-family: var(--op-font-display); font-weight: 700; font-size: 14px;
}
.rail-btn { width: 44px; height: 44px; border-radius: var(--op-radius-md); display: flex; align-items: center; justify-content: center; color: var(--op-light-green); }
.rail-btn svg { width: 22px; height: 22px; }
.rail-btn:hover { background: rgba(255,255,255,.1); color: var(--op-white); }
.rail-btn.active { background: var(--op-accent-lime); color: var(--op-dark-green); }
.main { flex: 1; min-width: 0; padding: 20px max(24px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px)); }

.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--op-dark-green); font-weight: 700; font-size: 13px; }
.back svg { width: 14px; height: 14px; }
.back:hover { text-decoration: underline; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--op-border-card); margin: 14px 0 20px; overflow-x: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; padding: 12px 16px; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent; color: var(--op-silver-dark); font-size: 15px;
}
.tab svg { width: 14px; height: 14px; }
.tab:hover { color: var(--op-dark-green); }
.tab.active { color: var(--op-dark-green); font-weight: 700; border-bottom-color: var(--op-dark-green); }
.stub { padding: 48px 16px; text-align: center; color: var(--op-silver-light); }
.stub h3 { margin: 0 0 6px; font-family: var(--op-font-display); font-weight: 600; color: var(--op-dark-green); }

/* ---------- Stat cards ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
.stat {
  position: relative; padding: 18px 20px; background: var(--op-white); border: 1px solid var(--op-border-card);
  border-radius: var(--op-radius-lg); box-shadow: var(--op-elevation-1);
}
.stat.highlight { background: rgba(209, 219, 189, .45); }
.stat-label { color: var(--op-silver-dark); font-size: 14px; }
.stat-value { margin: 12px 0 6px; font-family: var(--op-font-display); font-weight: 700; font-size: 24px; color: var(--op-dark-green); letter-spacing: -.01em; }
.stat-value.gold { color: var(--op-chip-warning-text); }
.stat-sub { font-size: 13px; color: var(--op-silver-dark); }
.stat-icon {
  position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: var(--op-radius-sm);
  background: rgba(191, 251, 79, .35); color: var(--op-dark-green); display: flex; align-items: center; justify-content: center;
}
.stat-icon svg { width: 14px; height: 14px; }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search {
  flex: 1 1 320px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px;
  background: var(--op-white); border: 1px solid var(--op-border-card); border-radius: var(--op-radius-md);
}
.search svg { width: 16px; height: 16px; color: var(--op-silver-dark); flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; }
.search:focus-within { border-color: var(--op-dark-green); box-shadow: var(--op-focus-ring); }
.select {
  height: 40px; min-width: 150px; padding: 0 12px; cursor: pointer; background: var(--op-white);
  border: 1px solid var(--op-border-card); border-radius: var(--op-radius-md); color: var(--op-silver-dark);
}
.select:focus { border-color: var(--op-dark-green); box-shadow: var(--op-focus-ring); outline: none; }
.seg { display: inline-flex; background: var(--op-white); border: 1px solid var(--op-border-card); border-radius: var(--op-radius-md); overflow: hidden; }
.seg button { height: 38px; padding: 0 16px; border: 0; background: none; cursor: pointer; color: var(--op-silver-dark); }
.seg button[aria-pressed="true"] { background: var(--op-dark-green); color: var(--op-white); font-family: var(--op-font-display); font-weight: 600; }
.btn-primary {
  height: 40px; padding: 0 18px; border: 0; border-radius: var(--op-radius-md); cursor: pointer;
  background: var(--op-accent-lime); color: var(--op-dark-green); font-family: var(--op-font-display); font-weight: 600;
}
.btn-primary:hover { background: var(--op-accent-lime-hover); }
.showing { margin: 0 0 12px; font-size: 13px; color: var(--op-silver-dark); }
.showing b { color: var(--op-dark-green); }

.focus-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 14px;
  background: var(--op-white); border: 1px solid var(--op-border-card); border-left: 4px solid var(--op-accent-lime);
  border-radius: var(--op-radius-lg); box-shadow: var(--op-elevation-1); line-height: 1.45;
}
.focus-banner b { color: var(--op-dark-green); }
.link-btn { margin-left: auto; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; color: var(--op-dark-green); border-bottom: 1.5px solid var(--op-dark-green); }

/* ---------- Board ---------- */
.board-wrap { overflow-x: auto; margin: 0 -6px; padding: 0 6px 8px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(250px, 1fr)); gap: 20px; min-width: 1330px; }
.col { min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; }
.stage-num {
  width: 20px; height: 20px; border-radius: 50%; background: var(--op-accent-lime); color: var(--op-dark-green);
  display: inline-flex; align-items: center; justify-content: center; font-family: var(--op-font-display); font-weight: 600; font-size: 11px;
}
.stage-num.closed { background: var(--op-dark-green); color: var(--op-white); }
.col-head h2 { margin: 0; font-family: var(--op-font-display); font-weight: 600; font-size: 16px; color: var(--op-dark-green); }
.col-count { margin: 6px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--op-border-card); font-size: 13px; color: var(--op-silver-dark); }
.cards { display: grid; gap: 12px; margin-top: 14px; }
.empty-col { padding: 22px 8px; text-align: center; color: var(--op-silver-light); font-size: 13px; border: 1.5px dashed var(--op-border-input); border-radius: var(--op-radius-lg); }

.card { min-width: 0; background: var(--op-white); border: 1px solid var(--op-border-card); border-radius: var(--op-radius-lg); box-shadow: var(--op-elevation-1); }
.card-main { padding: 14px 14px 12px; }
.card-id { font-size: 12px; color: var(--op-silver-light); letter-spacing: .02em; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin: 6px 0 12px; }
.card-top span { min-width: 0; font-family: var(--op-font-display); font-weight: 600; font-size: 15px; color: var(--op-dark-green); line-height: 1.4; }
.card-top b { flex-shrink: 0; font-family: var(--op-font-display); font-weight: 600; font-size: 15px; color: var(--op-chip-warning-text); }
.owner-row { display: flex; align-items: center; gap: 8px; }
.owner { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--op-silver-dark); }
.owner span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--op-font-display); font-weight: 600; font-size: 9px;
}
.avatar-1 { background: var(--op-avatar-1-bg); color: var(--op-avatar-1-text); }
.avatar-2 { background: var(--op-avatar-2-bg); color: var(--op-avatar-2-text); }
.avatar-3 { background: var(--op-avatar-3-bg); color: var(--op-avatar-3-text); }
.avatar-4 { background: var(--op-avatar-4-bg); color: var(--op-avatar-4-text); }
.tier { margin-left: auto; flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: var(--op-radius-full); border: 1px solid; }
.tier-growth { color: var(--op-chip-warning-text); border-color: rgba(138, 106, 0, .45); background: var(--op-chip-warning-bg); }
.tier-enterprise { color: var(--op-chip-success-text); border-color: rgba(15, 122, 69, .35); background: var(--op-chip-success-bg); }
.tier-sme { color: var(--op-chip-neutral-text); border-color: var(--op-border-input); background: var(--op-white); }
.card-note { margin-top: 10px; font-size: 12px; color: var(--op-silver-dark); line-height: 1.4; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px 12px; border-top: 1px solid var(--op-border-divider); font-size: 12px; color: var(--op-silver-light); }
.refs { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; }
.ref {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--op-radius-sm); text-decoration: none;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
}
.ref svg { width: 12px; height: 12px; }
.ref-rfq { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); }
.ref-quote { background: var(--op-light-green); color: var(--op-dark-green); }
a.ref:hover { box-shadow: 0 0 0 1.5px currentColor; }
.won, .lost { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--op-radius-sm); font-size: 12px; font-weight: 600; }
.won { background: var(--op-chip-success-bg); color: var(--op-chip-success-text); }
.lost { background: var(--op-chip-error-bg); color: var(--op-chip-error-text); }
.card.focus { border: 2px solid var(--op-dark-green); box-shadow: var(--op-focus-ring), var(--op-elevation-2); }
.from-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: var(--op-radius-sm); background: var(--op-dark-green); color: var(--op-accent-lime); font-size: 10px; font-weight: 700; }

/* ---------- List ---------- */
.list-card { background: var(--op-white); border: 1px solid var(--op-border-card); border-radius: var(--op-radius-lg); box-shadow: var(--op-elevation-1); overflow-x: auto; }
table { width: 100%; min-width: 900px; border-collapse: collapse; }
th { text-align: left; padding: 12px 14px; background: rgba(209, 219, 189, .35); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--op-silver-dark); white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--op-border-divider); white-space: nowrap; }
td.co { font-family: var(--op-font-display); font-weight: 600; color: var(--op-dark-green); }
td.val { font-family: var(--op-font-display); font-weight: 600; color: var(--op-chip-warning-text); }
tr.focus td { background: rgba(191, 251, 79, .28); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; padding: 10px 16px; border-radius: var(--op-radius-md);
  background: var(--op-dark-green); color: var(--op-cream); box-shadow: var(--op-elevation-3); font-size: 13px;
}

@media (max-width: 900px) { .stats { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  .shell { flex-direction: column; }
  .rail { width: 100%; height: auto; flex-direction: row; z-index: 20; padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
  .rail-mark { margin: 0 8px 0 0; }
  .main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .select { flex: 1 1 140px; min-width: 0; }
}
/* Brand bar: page context on the left, OnePort 365 logo on the right */
.brandbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 14px; }
.brand-logo { display: block; height: 40px; width: auto; margin-left: auto; }
@media (max-width: 700px) { .brand-logo { height: 32px; } }
  </style>
</head>

      <section id="panel-pipeline">

        <p class="showing" id="showing"></p>
        <div class="board-wrap" id="boardView"><div class="board" id="board"></div></div>
        <div class="list-card" id="listView" hidden></div>
      </section>

      <section id="panel-companies" class="stub" hidden><h3>Companies</h3><p>Not part of this preview.</p></section>
      <section id="panel-contacts" class="stub" hidden><h3>Contacts</h3><p>Not part of this preview.</p></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  function hash(str) { var x = 2166136261; for (var i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
  function avatar(name) {
    var ini = name.split(" ").map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
    return '<span class="avatar avatar-' + (hash(name) % 4 + 1) + '" aria-hidden="true">' + esc(ini) + "</span>";
  }
  function dateKey(d) { var p = d.split("-"); return (p[2] || "") + (p[1] || "") + (p[0] || ""); } // dd-mm-yyyy -> yyyymmdd
  var DOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>';

  // ---------- Deal passed in from the dashboard ----------
  var q = new URLSearchParams(location.search);
  var focus = null;
  if (q.get("deal") && q.get("customer")) {
    var stage = q.get("stage") || "prospect";
    var result = stage === "closed-won" ? "won" : stage === "closed-lost" ? "lost" : null;
    if (result) stage = "closed";
    if (!STAGES.some(function (s) { return s.id === stage; })) stage = "prospect";
    var link = q.get("rfqlink");
    focus = {
      id: q.get("deal"), company: q.get("customer"), value: Number(q.get("value")) || 0, owner: q.get("owner") || "",
      tier: null, created: q.get("created") || "", stage: stage, result: result, rfq: q.get("rfq"),
      rfqHref: link && /^rfq\.html\?/.test(link) ? link : null, // only ever link to the local RFQ table
      quote: q.get("quote"), quoteHref: /^quotes\.html\?/.test(q.get("quotelink") || "") ? q.get("quotelink") : null,
      note: q.get("note"), focus: true
    };
    DEALS = DEALS.filter(function (d) { return d.id !== focus.id; });
    DEALS.push(focus);
  }

  // ---------- Filters ----------
  var state = { q: "", owner: "", status: "", sort: "new", view: "board" };
  var owners = DEALS.map(function (d) { return d.owner; }).filter(function (o, i, a) { return o && a.indexOf(o) === i; }).sort();
  $("owner").innerHTML += owners.map(function (o) { return "<option>" + esc(o) + "</option>"; }).join("");

  function filtered() {
    var s = state.q.toLowerCase();
    var list = DEALS.filter(function (d) {
      var st = d.result || "open";
      return (!s || [d.id, d.company, d.owner, d.rfq, d.quote].join(" ").toLowerCase().indexOf(s) !== -1) &&
        (!state.owner || d.owner === state.owner) && (!state.status || st === state.status);
    });
    return list.sort(function (a, b) {
      if (state.sort === "value") return b.value - a.value;
      var c = dateKey(b.created).localeCompare(dateKey(a.created)) || b.id.localeCompare(a.id);
      return state.sort === "old" ? -c : c;
    });
  }

  function renderStats() {
    var open = DEALS.filter(function (d) { return d.stage !== "closed"; });
    var won = DEALS.filter(function (d) { return d.result === "won"; });
    var sum = function (l) { return l.reduce(function (t, d) { return t + d.value; }, 0); };
    var stat = function (cls, label, value, vcls, sub, icon) {
      return '<div class="stat ' + cls + '"><div class="stat-label">' + label + '</div><span class="stat-icon" aria-hidden="true">' + icon +
        '</span><div class="stat-value ' + vcls + '">' + value + '</div><div class="stat-sub">' + sub + "</div></div>";
    };
    $("stats").innerHTML =
      stat("highlight", "Active pipeline (USD)", money(sum(open)), "", open.length + " deals in progress",
        '<svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>') +
      stat("", "Deals won (USD)", money(sum(won)), "gold", won.length + " deals won",
        '<svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 01-10 0zM12 13v4M8 20h8M7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') +
      stat("", "Total deals", DEALS.length, "", "All-time deals",
        '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>');
  }

  function refs(d) {
    var r = "";
    if (d.rfq) r += (d.rfqHref ? '<a class="ref ref-rfq" href="' + esc(d.rfqHref) + '" title="Open in the RFQ table">' : '<span class="ref ref-rfq">') +
      DOC + esc(d.rfq) + (d.rfqHref ? "</a>" : "</span>");
    if (d.quote) r += (d.quoteHref ? '<a class="ref ref-quote" href="' + esc(d.quoteHref) + '" title="Open the quote">' : '<span class="ref ref-quote">') +
      DOC + esc(d.quote) + (d.quoteHref ? "</a>" : "</span>");
    return r ? '<div class="refs">' + r + "</div>" : "";
  }
  function card(d) {
    return '<article class="card' + (d.focus ? " focus" : "") + '"' + (d.focus ? ' id="focusCard" tabindex="-1"' : "") + ">" +
      '<div class="card-main"><div class="card-id">' + esc(d.id) + (d.focus ? '<span class="from-tag">From dashboard</span>' : "") + "</div>" +
      '<div class="card-top"><span>' + esc(d.company) + "</span><b>" + money(d.value) + "</b></div>" +
      '<div class="owner-row"><span class="owner">' + avatar(d.owner) + "<span>" + esc(d.owner) + "</span></span>" +
      (d.tier ? '<span class="tier tier-' + d.tier.toLowerCase() + '">' + esc(d.tier) + "</span>" : "") + "</div>" +
      (d.note ? '<div class="card-note">' + esc(d.note) + "</div>" : "") + "</div>" +
      '<div class="card-foot"><span>Created ' + esc(d.created) + "</span>" +
      (d.result === "won" ? '<span class="won">✓ Won</span>' : d.result === "lost" ? '<span class="lost">✕ Lost</span>' : "") +
      refs(d) + "</div></article>";
  }

  function render() {
    var list = filtered();
    $("showing").innerHTML = "Showing <b>" + list.length + "</b> of " + DEALS.length + " deals";
    $("board").innerHTML = STAGES.map(function (st, i) {
      var deals = list.filter(function (d) { return d.stage === st.id; });
      var total = deals.reduce(function (t, d) { return t + d.value; }, 0);
      var count = st.id === "closed"
        ? deals.filter(function (d) { return d.result === "won"; }).length + " won · " + deals.filter(function (d) { return d.result === "lost"; }).length + " lost"
        : deals.length + " · " + money(total);
      return '<section class="col" aria-labelledby="st-' + st.id + '"><div class="col-head"><span class="stage-num' + (st.id === "closed" ? " closed" : "") + '">' + (i + 1) +
        '</span><h2 id="st-' + st.id + '">' + esc(st.name) + '</h2></div><p class="col-count">' + count + "</p>" +
        '<div class="cards">' + (deals.length ? deals.map(card).join("") : '<div class="empty-col">No deals</div>') + "</div></section>";
    }).join("");
    $("listView").innerHTML = "<table><thead><tr><th>Deal ID</th><th>Company</th><th>Stage</th><th>Owner</th><th>Tier</th><th>Value</th><th>Created</th><th>RFQ / Quote</th></tr></thead><tbody>" +
      list.map(function (d) {
        var stage = STAGES.filter(function (s) { return s.id === d.stage; })[0].name + (d.result ? " · " + (d.result === "won" ? "Won" : "Lost") : "");
        return "<tr" + (d.focus ? ' class="focus"' : "") + "><td>" + esc(d.id) + '</td><td class="co">' + esc(d.company) + "</td><td>" + esc(stage) + "</td>" +
          '<td><span class="owner">' + avatar(d.owner) + "<span>" + esc(d.owner) + "</span></span></td>" +
          "<td>" + (d.tier ? '<span class="tier tier-' + d.tier.toLowerCase() + '" style="margin:0">' + esc(d.tier) + "</span>" : "—") + "</td>" +
          '<td class="val">' + money(d.value) + "</td><td>" + esc(d.created) + "</td><td>" + (esc([d.rfq, d.quote].filter(Boolean).join(" · ")) || "—") + "</td></tr>";
      }).join("") + "</tbody></table>";
    $("boardView").hidden = state.view !== "board";
    $("listView").hidden = state.view !== "list";
  }

  $("search").addEventListener("input", function () { state.q = this.value.trim(); render(); });
  $("owner").addEventListener("change", function () { state.owner = this.value; render(); });
  $("status").addEventListener("change", function () { state.status = this.value; render(); });
  $("sort").addEventListener("change", function () { state.sort = this.value; render(); });
  function setView(v) {
    state.view = v;
    $("viewBoard").setAttribute("aria-pressed", String(v === "board"));
    $("viewList").setAttribute("aria-pressed", String(v === "list"));
    render();
  }
  $("viewBoard").addEventListener("click", function () { setView("board"); });
  $("viewList").addEventListener("click", function () { setView("list"); });
  var toastTimer;
  $("newDeal").addEventListener("click", function () {
    var t = $("toast"); t.textContent = "Creating deals isn't part of this preview."; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2500);
  });
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    document.querySelectorAll(".tab").forEach(function (t) { var on = t === b; t.classList.toggle("active", on); t.setAttribute("aria-selected", String(on)); });
    ["pipeline", "companies", "contacts"].forEach(function (id) { $("panel-" + id).hidden = id !== b.getAttribute("data-tab"); });
  });

  renderStats();
  render();

  if (focus) {
    var stageName = STAGES.filter(function (s) { return s.id === focus.stage; })[0].name;
    var banner = $("banner");
    banner.innerHTML = "<span>Showing <b>" + esc(focus.company) + "</b> (" + esc(focus.id) + ") in <b>" + esc(stageName) +
      (focus.result ? " · " + (focus.result === "won" ? "Won" : "Lost") : "") + "</b>" + (focus.note ? " · " + esc(focus.note) : "") +
      '</span><button type="button" class="link-btn" id="clear">Show all deals</button>';
    banner.hidden = false;
    $("clear").addEventListener("click", function () { location.href = "crm.html"; });
    var el = $("focusCard");
    el.scrollIntoView({ block: "center", inline: "center" });
    el.focus({ preventScroll: true });
  }
})();
  </script>
</body>
</html>
